[package]
name = "teleprompter"
version = "0.1.0"
description = "Teleprompter Desktop App"
authors = ["Teleprompter"]
edition = "2021"

[lib]
name = "teleprompter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
